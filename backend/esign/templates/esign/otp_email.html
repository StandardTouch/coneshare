<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verification Code</title>
</head>
<body style="font-family: Arial, sans-serif; line-height: 1.6; color: #333; max-width: 600px; margin: 0 auto; padding: 20px;">
    <div style="background-color: #f4f4f4; padding: 20px; border-radius: 5px;">
        <h2 style="color: #2c3e50;">Verification Code</h2>
        
        <p>Hello {{ signer_name }},</p>
        
        <p>Your verification code for signing <strong>{{ document_title }}</strong> is:</p>
        
        <div style="background-color: white; padding: 20px; margin: 30px 0; border-radius: 5px; text-align: center;">
            <h1 style="color: #3498db; font-size: 36px; letter-spacing: 8px; margin: 0;">{{ otp_code }}</h1>
        </div>
        
        <p style="color: #e74c3c; font-size: 0.9em;">
            <strong>This code will expire in 10 minutes.</strong>
        </p>
        
        <p style="color: #7f8c8d; font-size: 0.85em; margin-top: 30px;">
            If you did not request this code, please ignore this email.
        </p>
        
        <p style="color: #7f8c8d; font-size: 0.85em;">
            This email was sent by {{ site_domain }}
        </p>
    </div>
</body>
</html>
