{% load i18n %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .button { display: inline-block; padding: 12px 24px; background-color: #0D7C75; color: #ffffff; text-decoration: none; border-radius: 6px; }
    </style>
</head>
<body>
    <p>{% trans "Welcome to Allure Clinic." %}</p>
    <p>{% trans "Please verify your email to activate your account:" %}</p>
    <p><a href="{{ verify_url }}" class="button">{% trans "Verify account" %}</a></p>
    <p>{% trans "If you did not request this, you can ignore this email." %}</p>
    <hr style="margin-top: 24px; border: none; border-top: 1px solid #e5e7eb;">
    <p style="font-size: 12px; color: #6b7280;">© {% now "Y" %} Allure Clinic. {% trans "All rights reserved." %}</p>
</body>
</html>
