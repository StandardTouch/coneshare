name: Build Dev Image

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  build-and-push-dev:
    name: Build and Push Dev Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract short commit SHA
        id: sha
        run: echo "short_sha=$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT

      - name: Build dev images
        run: |
          docker build -t coneshare-core:latest -f core/Dockerfile ./core
          docker build \
            --build-arg VITE_APP_VERSION=dev \
            --build-arg VITE_GIT_SHA=${{ steps.sha.outputs.short_sha }} \
            -t coneshare-frontend:latest -f frontend/Dockerfile ./frontend
          docker build -t coneshare:latest -f backend/Dockerfile ./backend

      - name: Tag and push images
        run: |
          docker tag coneshare:latest ghcr.io/standardtouch/coneshare:dev
          docker tag coneshare:latest ghcr.io/standardtouch/coneshare:dev-${{ steps.sha.outputs.short_sha }}
          docker push ghcr.io/standardtouch/coneshare:dev
          docker push ghcr.io/standardtouch/coneshare:dev-${{ steps.sha.outputs.short_sha }}

  deploy-to-coolify-dev:
    name: Deploy to Coolify (dev)
    runs-on: ubuntu-latest
    needs: build-and-push-dev
    if: github.ref == 'refs/heads/dev'
    concurrency:
      group: coolify-deploy-dev
      cancel-in-progress: false

    steps:
      - name: Trigger Coolify dev restart
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          DEV_SERVICE_UUID: okabs4ku069mltbeifxveyqa
        run: |
          if [ -z "$COOLIFY_TOKEN" ]; then echo "COOLIFY_TOKEN not set, skipping"; exit 0; fi
          http_code=$(curl -s -w "%{http_code}" -o /dev/null -X POST \
            "https://server.allureclinic.com/api/v1/services/${DEV_SERVICE_UUID}/restart?latest=true" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json")
          echo "HTTP Status: $http_code"
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then exit 1; fi

      - name: Verify dev health
        timeout-minutes: 12
        run: |
          sleep 60
          ok=0
          for i in $(seq 1 60); do
            if curl -sf --max-time 10 "https://dev-share.allureclinic.com/api/v1/_health/" > /dev/null; then
              ok=$((ok+1)); echo "healthy ($ok/3)"
              [ $ok -ge 3 ] && exit 0
            else
              ok=0; echo "not healthy yet (attempt $i)"
            fi
            sleep 10
          done
          exit 1
